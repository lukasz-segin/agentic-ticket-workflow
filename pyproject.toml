[project]
name = "agentic-ticket-workflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukasz", email = "lukasz.segin1990@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.3",
    "temporalio>=1.35.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-ticket-workflow = "agentic_ticket_workflow:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, comprehensions, async, ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]
